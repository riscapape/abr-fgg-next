name: Manter Supabase Ativo

on:
  schedule:
    # Executa automaticamente a cada 3 dias à meia-noite (UTC)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite forçar o teste manualmente

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Consulta de Teste
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
